name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels only. The whole suite works on the graph and on the committed
      # log, so CI never downloads CIFAR-10 and never trains anything.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install matplotlib pytest

      - name: Test
        run: pytest -q

      # Redundant with the suite, which shells out to it, but a failure here
      # names the stale figure directly in the log instead of inside a traceback.
      - name: README numbers agree with the search log
        run: python check_numbers.py

      - name: Figures still redraw from the log
        run: python experiments/make_figures.py
