name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels only. The suite works on the graph and on the committed log,
      # so CI never downloads CIFAR-10 and never trains anything.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install matplotlib pytest

      - name: Test
        run: pytest -q

      - name: README numbers agree with the search log
        run: python check_numbers.py

      - name: Figures still redraw from the log
        run: python experiments/make_figures.py

      # If search/blocks.py changes and the export is not regenerated, the
      # committed op table describes a network that no longer exists. This
      # catches that, and it is the only step that needs torch and a compiler
      # in the same job.
      - name: The committed export still matches the model
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          cp firmware/generated/micronet_arch.h /tmp/arch.before
          python export/export_c.py
          diff /tmp/arch.before firmware/generated/micronet_arch.h
          make -C firmware test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A second, stricter toolchain over the same sources. gcc with -Werror
      # here, clang on the developer machine, so a warning that only one of
      # them emits still fails the build.
      - name: Build and test with gcc, warnings fatal
        run: make -C firmware test CC=gcc CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Werror -I."

      - name: Build and test with clang
        run: |
          make -C firmware clean
          make -C firmware test CC=clang CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Werror -I."

      - name: CMake build, both languages
        run: |
          cmake -S firmware -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Latency benchmark
        run: ./build/bench firmware/generated 20

  # The README's numbers are produced by Python and checked by Python. This
  # recomputes them in SQL and in R from the raw logs, and then corrupts a log
  # and requires the harness to notice, because a check that cannot fail is not
  # evidence.
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R if the runner does not have it
        run: |
          command -v Rscript || sudo apt-get install -y --no-install-recommends r-base-core

      - name: Recompute the published numbers in SQL and R
        run: ./verify/verify.sh

      - name: The harness rejects a corrupted search log
        run: |
          cp results/search_log.csv /tmp/search_log.csv
          sed -i '2s/0.4655/0.4695/' results/search_log.csv
          if ./verify/verify.sh; then
            echo "FAIL: the harness passed on a corrupted search log"
            exit 1
          fi
          cp /tmp/search_log.csv results/search_log.csv
          ./verify/verify.sh

      - name: The harness rejects a corrupted retest log
        run: |
          cp results/validation.csv /tmp/validation.csv
          sed -i 's/^winner,2,0.4968/winner,2,0.4868/' results/validation.csv
          if ./verify/verify.sh; then
            echo "FAIL: the harness passed on a corrupted retest log"
            exit 1
          fi
          cp /tmp/validation.csv results/validation.csv
          ./verify/verify.sh
